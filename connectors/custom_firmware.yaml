#
# ECUstm32 proto 1 canale — CN1 (TE 1-776087-1, 23 vie)
# Fonte: netlist Sheet_1_2026-08-05.net (net -> CN1-n -> pin MCU)
#

pins:
  - pin: 1
    function: 12V_MAIN (da main relay)
    type: 12V

  - pin: 2
    function: 12V_MAIN (da main relay)
    type: 12V

  - pin: 3
    function: 12V_KEY (sotto chiave)
    type: 12V

  - pin: 4
    function: GND potenza
    type: gnd

  - pin: 5
    function: AGND massa sensori
    type: sgnd

  - pin: 6
    function: VREF_5V alimentazione sensori
    type: 5V

  - pin: 7
    id: C6
    class: outputs
    function: Contagiri (open collector)
    ts_name: 7 - Tach out
    type: ls

  - pin: 8
    id: EFI_ADC_3
    class: analog_inputs
    function: CLT (NTC, pull-up 2.49k)
    ts_name: 8 - CLT
    type: at

  - pin: 9
    id: EFI_ADC_2
    class: analog_inputs
    function: IAT (NTC, pull-up 2.49k)
    ts_name: 9 - IAT
    type: at

  - pin: 10
    id: EFI_ADC_5
    class: analog_inputs
    function: MAP 0-5V
    ts_name: 10 - MAP
    type: av

  - pin: 11
    id: EFI_ADC_6
    class: analog_inputs
    function: TPS 0-5V
    ts_name: 11 - TPS
    type: av

  - pin: 12
    id: EFI_ADC_13
    class: analog_inputs
    function: Wideband 0-5V
    ts_name: 12 - WBO2
    type: av

  - pin: 13
    id: E9
    class: event_inputs
    function: VR1+ albero motore (MAX9926 IN1+)
    ts_name: 13/14 - VR1 Crank
    type: vr

  - pin: 14
    function: VR1- albero motore (MAX9926 IN1-)
    type: vr

  - pin: 15
    id: D3
    class: outputs
    function: Iniettore 1
    ts_name: 15 - Injector 1
    type: inj

  - pin: 16
    id: G0
    class: outputs
    function: Bobina 1 (smart o IGBT, jumper SJ2/SJ3)
    ts_name: 16 - Ignition 1
    type: ign

  - pin: 17
    id: D0
    class: outputs
    function: Rele' pompa benzina
    ts_name: 17 - Fuel pump relay
    type: ls

  - pin: 18
    id: G14
    class: outputs
    function: Main relay
    ts_name: 18 - Main relay
    type: mr

  - pin: 19
    id: B11
    class: outputs
    function: Idle PWM
    ts_name: 19 - Idle
    type: ls

  - pin: 20
    function: CAN1 H
    type: can

  - pin: 21
    function: CAN1 L
    type: can

  - pin: 22
    id: E7
    class: switch_inputs
    function: Interruttore frizione (pull-up 2.2k)
    ts_name: 22 - Clutch
    type: din

  - pin: 23
    id: B7
    class: outputs
    function: WP1_PWM (open drain, pull-up 4.7k a 5V)
    ts_name: 23 - WP1 PWM
    type: ls

  - pin: IGN
    id: G15
    class: switch_inputs
    function: Sense chiave interno (da 12V_KEY, partitore 47k/10k)
    ts_name: Ignition key sense
    type: din
