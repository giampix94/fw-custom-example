dialog = turboTimerDialog, "Turbo Timer"
	field = "!Keeps the engine running after key-off to let the turbo cool down."
	field = "Turbo timer",                     turboTimerEnabled
	field = "Countdown duration",               turboTimerDurationSec, { turboTimerEnabled }
	field = "#Activation criteria (evaluated on the decaying peak reached while driving)"
	field = "#If none are selected, the timer always runs at key-off"
	field = "Use EGT peak",                     turboTimerUseEgt, { turboTimerEnabled }
	field = "    EGT threshold",                 turboTimerEgtThreshold, { turboTimerEnabled && turboTimerUseEgt }
	field = "    EGT peak half-life",            turboTimerEgtPeakWindowMin, { turboTimerEnabled && turboTimerUseEgt }
	field = "Use oil temperature peak",          turboTimerUseOilTemp, { turboTimerEnabled }
	field = "    Oil temperature threshold",     turboTimerOilTempThreshold, { turboTimerEnabled && turboTimerUseOilTemp }
	field = "    Oil temperature peak half-life", turboTimerOilPeakWindowMin, { turboTimerEnabled && turboTimerUseOilTemp }
	field = "Use coolant (CLT) peak",            turboTimerUseClt, { turboTimerEnabled }
	field = "    Coolant threshold",              turboTimerCltThreshold, { turboTimerEnabled && turboTimerUseClt }
	field = "    Coolant peak half-life",         turboTimerCltPeakWindowMin, { turboTimerEnabled && turboTimerUseClt }
	field = "Use boost (MAP) peak",               turboTimerUseBoost, { turboTimerEnabled }
	field = "    Boost threshold",                turboTimerBoostThreshold, { turboTimerEnabled && turboTimerUseBoost }
	field = "    Boost peak half-life",           turboTimerBoostPeakWindowMin, { turboTimerEnabled && turboTimerUseBoost }
	field = "#Raised idle during the countdown"
	field = "#The RPM box unlocks only if an idle output is assigned"
	field = "Raise idle",                        turboTimerRaiseIdle, { turboTimerEnabled }
	field = "    Idle target during countdown",  turboTimerIdleRpm, { turboTimerEnabled && turboTimerRaiseIdle && (idle_solenoidPin != 0 || (useStepperIdle && idle_stepperStepPin != 0)) }
dialog = alsCanDialog, "ALS CAN-BUS"
	field = "!Anti-lag parallelo pilotato da CAN (console esterna, manopola livello 1-4 + RACE MODE). Indipendente dall'antilag nativo rusEFI (attualmente inattivo nel firmware in uso)."
	field = "ALS CAN-BUS",                     alsCanEnabled
	field = "#Condizioni di armo/attivazione"
	field = "Soglia TPS di armo",               alsCanArmTps, { alsCanEnabled }
	field = "Ritardo di armo",                  alsCanArmDelayMs, { alsCanEnabled }
	field = "RPM minimo",                       alsCanMinRpm, { alsCanEnabled }
	field = "RPM massimo",                      alsCanMaxRpm, { alsCanEnabled }
	field = "CLT minima",                       alsCanMinClt, { alsCanEnabled }
	field = "CLT massima (disattiva se superata)", alsCanMaxClt, { alsCanEnabled }
	field = "Durata massima attivazione",       alsCanMaxDurationSec, { alsCanEnabled }
	field = "Tempo minimo tra attivazioni",     alsCanMinTimeBetweenSec, { alsCanEnabled }
	field = "#Post-disattivazione"
	field = "Limite giri post-disattivazione",  alsCanPostDisableRpmLimit, { alsCanEnabled }
	field = "Durata limite post-disattivazione", alsCanPostDisableSec, { alsCanEnabled }
	field = "#Livello 1 (manopola)"
	field = "Limite anticipo",                  alsCanL1TimingLimit, { alsCanEnabled }
	field = "Ignition cut",                     alsCanL1IgnCutPct, { alsCanEnabled }
	field = "Correzione boost aim",             alsCanL1BoostAimAdd, { alsCanEnabled }
	field = "#Livello 2 (manopola)"
	field = "Limite anticipo",                  alsCanL2TimingLimit, { alsCanEnabled }
	field = "Ignition cut",                     alsCanL2IgnCutPct, { alsCanEnabled }
	field = "Correzione boost aim",             alsCanL2BoostAimAdd, { alsCanEnabled }
	field = "#Livello 3 (manopola)"
	field = "Limite anticipo",                  alsCanL3TimingLimit, { alsCanEnabled }
	field = "Ignition cut",                     alsCanL3IgnCutPct, { alsCanEnabled }
	field = "Correzione boost aim",             alsCanL3BoostAimAdd, { alsCanEnabled }
	field = "#Livello 4 (manopola)"
	field = "Limite anticipo",                  alsCanL4TimingLimit, { alsCanEnabled }
	field = "Ignition cut",                     alsCanL4IgnCutPct, { alsCanEnabled }
	field = "Correzione boost aim",             alsCanL4BoostAimAdd, { alsCanEnabled }
dialog = tcCanDialog, "TC CAN-BUS"
	field = "!Controllo trazione pilotato da CAN (console esterna, manopola livello 0-5). v1: slittamento percentuale fisso, metodo a rapporto cambio riservato per quando la marcia inserita sara' disponibile."
	field = "TC CAN-BUS",                      tcCanEnabled
	field = "Layout di trazione",               tcCanDrivetrainLayout, { tcCanEnabled }
	field = "Metodo di intervento",             tcCanInterventionMethod, { tcCanEnabled }
	field = "Velocita' minima di intervento",   tcCanMinSpeedKmh, { tcCanEnabled }
	field = "#Target di slittamento per livello (manopola 0-5)"
	field = "Livello 0",                        tcCanL0SlipTargetPct, { tcCanEnabled }
	field = "Livello 1",                        tcCanL1SlipTargetPct, { tcCanEnabled }
	field = "Livello 2",                        tcCanL2SlipTargetPct, { tcCanEnabled }
	field = "Livello 3",                        tcCanL3SlipTargetPct, { tcCanEnabled }
	field = "Livello 4",                        tcCanL4SlipTargetPct, { tcCanEnabled }
	field = "Livello 5",                        tcCanL5SlipTargetPct, { tcCanEnabled }
	field = "#Rientro coppia dopo intervento"
	field = "Ramp out",                         tcCanRampOutPct, { tcCanEnabled }

dialog = wmiCanDialog, "WMI CAN-BUS"
	field = "!Iniezione acqua/metanolo pilotata da CAN (cmdWmi + conferma pressione). Mappa 2D di anticipo extra (RPM x boost) ancora senza editor grafico in questo pannello - solo abilitazione qui per ora."
	field = "WMI CAN-BUS",                      wmiCanEnabled
