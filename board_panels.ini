dialog = turboTimerDialog, "Turbo Timer"
	field = "!Keeps the engine running after key-off to let the turbo cool down."
	field = "Turbo timer",                     turboTimerEnabled
	field = "Countdown duration",               turboTimerDurationSec, { turboTimerEnabled }
	field = "#Activation criteria (evaluated on the decaying peak reached while driving)"
	field = "#If none are selected, the timer always runs at key-off"
	field = "Use EGT peak",                     turboTimerUseEgt, { turboTimerEnabled }
	field = "    EGT threshold",                 turboTimerEgtThreshold, { turboTimerEnabled && turboTimerUseEgt }
	field = "    EGT peak half-life",            turboTimerEgtPeakWindowMin, { turboTimerEnabled && turboTimerUseEgt }
	field = "Use oil temperature peak",          turboTimerUseOilTemp, { turboTimerEnabled }
	field = "    Oil temperature threshold",     turboTimerOilTempThreshold, { turboTimerEnabled && turboTimerUseOilTemp }
	field = "    Oil temperature peak half-life", turboTimerOilPeakWindowMin, { turboTimerEnabled && turboTimerUseOilTemp }
	field = "Use coolant (CLT) peak",            turboTimerUseClt, { turboTimerEnabled }
	field = "    Coolant threshold",              turboTimerCltThreshold, { turboTimerEnabled && turboTimerUseClt }
	field = "    Coolant peak half-life",         turboTimerCltPeakWindowMin, { turboTimerEnabled && turboTimerUseClt }
	field = "Use boost (MAP) peak",               turboTimerUseBoost, { turboTimerEnabled }
	field = "    Boost threshold",                turboTimerBoostThreshold, { turboTimerEnabled && turboTimerUseBoost }
	field = "    Boost peak half-life",           turboTimerBoostPeakWindowMin, { turboTimerEnabled && turboTimerUseBoost }
	field = "#Raised idle during the countdown"
	field = "#The RPM box unlocks only if an idle output is assigned"
	field = "Raise idle",                        turboTimerRaiseIdle, { turboTimerEnabled }
	field = "    Idle target during countdown",  turboTimerIdleRpm, { turboTimerEnabled && turboTimerRaiseIdle && (idle_solenoidPin != 0 || (useStepperIdle && idle_stepperStepPin != 0)) }

