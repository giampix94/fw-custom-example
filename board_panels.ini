dialog = tcCanDialog, "TC CAN-BUS", yAxis
	field = "!Controllo trazione pilotato da CAN (console esterna, manopola livello 0-5). v1: slittamento percentuale fisso; il metodo a rapporto cambio e' riservato per quando la marcia inserita sara' disponibile."
	field = "TC CAN-BUS",                      tcCanEnabled
	field = "!Dato CAN: livello 0-5 letto dal frame CAN 0x200 byte 3, decodificato da ecu_can_protocol.lua (NON il CAN-RX standard di TunerStudio)."
