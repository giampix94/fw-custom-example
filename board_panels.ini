	field = "Metodo di intervento",             tcCanInterventionMethod, { tcCanEnabled }
	field = "Velocita' minima di intervento (km/h)",   tcCanMinSpeedKmh, { tcCanEnabled }
	field = "#Target di slittamento per livello (manopola 0-5, in %)"
	field = "Livello 0 (nessun intervento)",    tcCanL0SlipTargetPct, { tcCanEnabled }
	field = "Livello 1",                        tcCanL1SlipTargetPct, { tcCanEnabled }
	field = "Livello 2",                        tcCanL2SlipTargetPct, { tcCanEnabled }
	field = "Livello 3",                        tcCanL3SlipTargetPct, { tcCanEnabled }
	field = "Livello 4",                        tcCanL4SlipTargetPct, { tcCanEnabled }
	field = "Livello 5 (massima intrusivita')", tcCanL5SlipTargetPct, { tcCanEnabled }
	field = "#Rientro coppia dopo intervento"
	field = "Ramp out (% per ciclo)",           tcCanRampOutPct, { tcCanEnabled }

dialog = wmiCanDialog, "WMI CAN-BUS", yAxis
	field = "!Iniezione acqua/metanolo pilotata da CAN (cmdWmi + conferma pressione). Mappa 2D di anticipo extra (RPM x boost), rientro istantaneo alla mappa base alla perdita di pressione."
	field = "WMI CAN-BUS",                      wmiCanEnabled
	field = "!Dato CAN: comando/conferma letti dal frame CAN 0x200 byte 0 bit 3, decodificato da ecu_can_protocol.lua (NON il CAN-RX standard di TunerStudio)."
	panel = wmiCanTimingAddTbl, { wmiCanEnabled }
