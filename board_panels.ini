dialog = turboTimerDialog, "Turbo Timer (raffreddamento turbo)"
	field = "!Tiene il motore acceso dopo key-off per far raffreddare il turbo."
	field = "!Richiede main relay pilotato dalla ECU (gia' cosi' su questa scheda)."
	field = "Turbo timer",						turboTimerEnabled
	field = "Durata countdown",					turboTimerDurationSec, { turboTimerEnabled }

	field = "#Criteri di attivazione (valutati sul picco raggiunto in guida)"
	field = "#Se non selezioni nulla: timer classico, sempre attivo al key-off"
	field = "Usa picco EGT",					turboTimerUseEgt, { turboTimerEnabled }
	field = "    soglia EGT",					turboTimerEgtThreshold, { turboTimerEnabled && turboTimerUseEgt }
	field = "Usa picco temperatura olio",		turboTimerUseOilTemp, { turboTimerEnabled }
	field = "    soglia olio",					turboTimerOilTempThreshold, { turboTimerEnabled && turboTimerUseOilTemp }
	field = "Usa picco CLT",					turboTimerUseClt, { turboTimerEnabled }
	field = "    soglia CLT",					turboTimerCltThreshold, { turboTimerEnabled && turboTimerUseClt }
	field = "Usa picco boost (MAP)",			turboTimerUseBoost, { turboTimerEnabled }
	field = "    soglia boost",					turboTimerBoostThreshold, { turboTimerEnabled && turboTimerUseBoost }

	field = "#Minimo alzato durante il countdown"
	field = "#La casella giri si sblocca solo se un'uscita minimo e' assegnata"
	field = "Alza il minimo",					turboTimerRaiseIdle, { turboTimerEnabled }
	field = "Regime minimo durante countdown",	turboTimerIdleRpm, { turboTimerEnabled && turboTimerRaiseIdle && (idle_solenoidPin != 0 || (useStepperIdle && idle_stepperStepPin != 0)) }
