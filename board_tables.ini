; board_tables.ini
; Blocchi "table" per gli editor grafici (TableEditor) di ALS-CAN e WMI-CAN.
; Sintassi ripresa 1:1 da tunerstudio.template.ini (submodule, pinnato
; a2d8784fb6f3599044cc0d7ec2c9fcb68912b2f7), blocco "IgnRetardTableALS"/
; "FuelAdderTableALS" dell'antilag nativo (righe 1273-1287) - stessa struttura,
; stessi nomi di parametro (xBins/yBins/zBins/gridHeight/gridOrient/upDownLabel).
; Questo file viene incluso dentro la sezione [TableEditor] gia' presente nel
; template (BOARD_TABLES_FROM_FILE, tunerstudio.template.ini riga 1193).

	table = alsCanL1FuelAdjTbl, alsCanL1FuelAdj, "ALS-CAN L1 - Fuel Adjustment", 1
